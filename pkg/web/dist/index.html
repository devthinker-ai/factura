<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factura</title>
    <script>
      /* No-flash theme boot — mirrors src/lib/theme.ts bootTheme. */
      (function () {
        try {
          var k = 'factura:theme'
          var pref = localStorage.getItem(k)
          if (pref !== 'light' && pref !== 'dark' && pref !== 'system') pref = 'system'
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
    <script type="module" crossorigin src="/app/assets/index-C4qRI4pE.js"></script>
    <link rel="stylesheet" crossorigin href="/app/assets/index-C1RV-xtZ.css">
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased">
    <div id="root"></div>
  </body>
</html>
